<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Uhr – Dhikr-Zähler</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;600&amp;family=Aref+Ruqaa:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tap{transition: transform .12s}
.tap:active{transform: scale(.96)}
</style>
</helmet>
<div style="width: 480px; height: 320px; box-sizing: border-box; padding: 16px 24px; background: #1B2347; color: #EEF0F7; font-family: 'Readex Pro', system-ui, sans-serif; display: flex; align-items: center; gap: 22px">
  <button class="tap" onClick="{{tap}}" aria-label="Zählen" style="width: 220px; height: 220px; border-radius: 50%; border: 0; padding: 0; background: transparent; cursor: pointer; position: relative; color: #EEF0F7">
    <svg width="220" height="220" viewBox="0 0 220 220" style="position: absolute; left: 0; top: 0">
      <circle cx="110" cy="110" r="96" fill="#232D58" stroke="#323D6E" stroke-width="10"></circle>
      <circle cx="110" cy="110" r="96" fill="none" stroke="#F0A39A" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="{{dash}}" transform="rotate(-90 110 110)"></circle>
    </svg>
    <span style="position: absolute; left: 0; right: 0; top: 70px; font-size: 64px; font-weight: 200; line-height: 1; font-family: 'Readex Pro', sans-serif">{{count}}</span>
    <span style="position: absolute; left: 0; right: 0; top: 142px; font-size: 13px; color: #A7AFD0; font-family: 'Readex Pro', sans-serif">von {{target}}</span>
  </button>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 10px">
    <div style="font-family: 'Aref Ruqaa', serif; font-size: 40px; line-height: 1.2; color: #F0A39A" lang="ar" dir="rtl">{{arabic}}</div>
    <div style="font-size: 15px; color: #A7AFD0">{{meaning}}</div>
    <div style="display: flex; gap: 6px; margin-top: 6px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <span style="{{s.style}}"></span>
      </sc-for>
    </div>
    <div style="font-size: 13px; color: #A7AFD0; margin-top: 4px">Gesamt {{total}} / 100</div>
    <button onClick="{{reset}}" style="align-self: flex-start; margin-top: 6px; border: 1px solid #3A4578; background: transparent; color: #EEF0F7; border-radius: 999px; padding: 10px 18px; font: inherit; font-size: 14px; cursor: pointer; min-height: 44px">Neu beginnen</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":320}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { total: 0 }; }
  renderVals() {
    const phases = [
      { arabic: 'سُبْحَانَ اللّٰه', meaning: 'Gepriesen sei Allah', n: 33 },
      { arabic: 'الْحَمْدُ لِلّٰه', meaning: 'Alles Lob gebührt Allah', n: 33 },
      { arabic: 'اللّٰهُ أَكْبَر', meaning: 'Allah ist größer', n: 34 },
    ];
    const total = this.state.total;
    let rest = total, idx = 0;
    while (idx < 2 && rest >= phases[idx].n) { rest -= phases[idx].n; idx++; }
    const p = phases[idx];
    const count = Math.min(rest, p.n);
    const pct = Math.round(count * 100 / p.n);
    return {
      count, target: p.n, arabic: p.arabic, meaning: p.meaning, total,
      dash: pct + ' 100',
      steps: phases.map((_, i) => ({ style: 'width: 34px; height: 6px; border-radius: 6px; background: ' + (i < idx ? '#F0A39A' : i === idx ? '#A7AFD0' : '#323D6E') })),
      tap: () => this.setState({ total: Math.min(100, this.state.total + 1) }),
      reset: () => this.setState({ total: 0 }),
    };
  }
}
</script>
</body>
</html>
