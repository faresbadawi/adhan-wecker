<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Azan Clock</title>
<meta name="description" content="Smart Azan Clock">
<meta name="theme-color" content="#0b0c0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Azan Clock">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="nav">
    <div class="brand"><img src="/icons/icon-192.png" alt=""><div><b data-t="app"></b><small id="sideHost"></small></div></div>
    <div id="nav"></div>
    <div class="grow"></div>
    <button class="install" id="install" hidden></button>
  </nav>
  <main><div class="view" id="view"></div></main>
</div>

<div class="sheet" id="sheet" hidden><div class="sheetcard" id="sheetList"></div></div>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
