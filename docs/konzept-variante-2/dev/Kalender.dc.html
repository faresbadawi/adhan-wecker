<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Uhr – Kalender</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;600&amp;family=Aref+Ruqaa:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 480px; height: 320px; box-sizing: border-box; padding: 16px 20px; background: #0D1328; color: #E8EAF2; font-family: 'Readex Pro', system-ui, sans-serif; display: flex; gap: 18px">
  <div style="width: 266px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 20px">Oktober 2026</span><span style="font-size: 12px; color: #8E97B5">Rabīʿ I – II</span></div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 11px; color: #8E97B5; padding: 4px 0">
      <span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span style="color: #D9C38E">Fr</span><span>Sa</span><span>So</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px; text-align: center">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
        <div style="{{d.style}}"><span style="font-size: 15px">{{d.g}}</span><span style="font-size: 9px; opacity: 0.6">{{d.h}}</span></div>
      </sc-for>
    </div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid #263055; padding-left: 18px">
    <div style="font-family: 'Aref Ruqaa', serif; font-size: 30px; color: #D9C38E; line-height: 1.1" lang="ar" dir="rtl">ربيع الآخر</div>
    <div style="font-size: 13px; color: #8E97B5">1448 nach der Hidschra</div>
    <div style="font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #8E97B5; margin-top: 8px">Besondere Tage</div>
    <div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px">
      <div style="display: flex; justify-content: space-between"><span>Isra &amp; Mi'radsch</span><span style="color: #8E97B5">≈ 16. Jan.</span></div>
      <div style="display: flex; justify-content: space-between"><span>Ramadan-Beginn</span><span style="color: #8E97B5">≈ 8. Feb.</span></div>
      <div style="display: flex; justify-content: space-between"><span>Eid al-Fitr</span><span style="color: #8E97B5">≈ 10. März</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const cells = [];
    for (let i = 0; i < 3; i++) cells.push({ g: '', h: '', style: 'height: 34px' });
    for (let d = 1; d <= 31; d++) {
      const hijri = ((d + 18) % 30) + 1;
      const today = d === 8;
      const friday = (d + 2) % 7 === 0 || d === 2 || d === 9 || d === 16 || d === 23 || d === 30;
      let style = 'height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; line-height: 1.1';
      if (today) style += '; background: #D9C38E; color: #0D1328';
      else if (friday) style += '; color: #D9C38E';
      cells.push({ g: String(d), h: String(hijri), style });
    }
    while (cells.length < 35) cells.push({ g: '', h: '', style: 'height: 34px' });
    return { days: cells };
  }
}
</script>
</body>
</html>
