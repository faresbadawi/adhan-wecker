<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Azan Clock</title>
<meta name="description" content="Smart Azan Clock">
<meta name="theme-color" content="#0b0c0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Azan Clock">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="nav">
    <div class="brand"><img src="/icons/icon-192.png" alt=""><div><b data-t="app"></b><small id="sideHost"></small></div></div>
    <div id="nav"></div>
    <div class="grow"></div>
    <button class="install" id="install" hidden></button>
  </nav>
  <main><div class="view" id="view"></div></main>
</div>

<div class="voice" id="voice">
  <div class="answer" id="answer" hidden>
    <div class="t"><small id="ansQ"></small><p id="ansA"></p></div>
    <button class="round" id="ansClose" aria-label="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <form class="voicebar" id="ask">
    <input id="askText" autocomplete="off" enterkeyhint="send">
    <button class="round" type="submit" id="askSend" aria-label="send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="round mic" type="button" id="askMic" aria-label="mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </form>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
