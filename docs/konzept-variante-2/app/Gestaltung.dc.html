<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>App – Gestaltung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{color:#E8A27C; text-decoration: none}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #3F2536; color: #F6EAEE; font-family: 'Readex Pro', system-ui, sans-serif">
  <svg width="390" height="150" style="position: absolute; left: 0; top: 0">
    <defs>
      <pattern id="gz" width="56" height="56" patternUnits="userSpaceOnUse"><g fill="none" stroke="#E8A27C" stroke-width="0.9"><rect x="16" y="16" width="24" height="24"></rect><rect x="16" y="16" width="24" height="24" transform="rotate(45 28 28)"></rect><circle cx="28" cy="28" r="5"></circle><path d="M0 28h10M46 28h10M28 0v10M28 46v10M0 0l10 10M56 0 46 10M0 56l10-10M56 56 46 46"></path></g></pattern>
      <linearGradient id="lz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"></stop><stop offset="1" stop-color="#000"></stop></linearGradient>
      <mask id="mz"><rect width="390" height="150" fill="url(#lz)"></rect></mask>
    </defs>
    <rect width="390" height="150" fill="url(#gz)" opacity="0.3" mask="url(#mz)"></rect>
  </svg>
  <div style="position: relative; padding: 22px 22px 0; display: flex; align-items: center; gap: 12px">
    <a href="Uhr.dc.html" aria-label="Zurück" style="width: 40px; height: 40px; border-radius: 50%; background: #4E2E43; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F6EAEE" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"></path></svg></a>
    <span style="font-size: 28px; font-weight: 600">Gestaltung</span>
  </div>

  <div style="position: relative; margin: 18px 22px 0; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #CDAAB9">Farben</div>
  <div style="position: relative; margin: 8px 22px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <button style="border-radius: 16px; border: 2px solid #E8A27C; background: #4E2E43; padding: 8px; display: flex; flex-direction: column; gap: 8px; color: #F6EAEE; font: inherit; font-size: 13px; cursor: pointer">
      <span style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 54px; border-radius: 10px; overflow: hidden"><span style="background: #252C4A"></span><span style="background: #FBF7EF"></span><span style="background: #EFE4D1"></span><span style="background: #3F2536; box-shadow: inset 0 0 0 1px #6A4560"></span><span style="background: #121933"></span></span>Nach Tageszeit
    </button>
    <button style="border-radius: 16px; border: 1px solid #5E3B53; background: transparent; padding: 8px; display: flex; flex-direction: column; gap: 8px; color: #F6EAEE; font: inherit; font-size: 13px; cursor: pointer">
      <span style="height: 54px; border-radius: 10px; background: #121933"></span>Immer Nacht
    </button>
    <button style="border-radius: 16px; border: 1px solid #5E3B53; background: transparent; padding: 8px; display: flex; flex-direction: column; gap: 8px; color: #F6EAEE; font: inherit; font-size: 13px; cursor: pointer">
      <span style="height: 54px; border-radius: 10px; background: #FBF7EF"></span>Immer Tag
    </button>
  </div>

  <div style="margin: 20px 22px 0; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #CDAAB9">Dein Tag in Farben</div>
  <div style="margin: 8px 22px 0; display: flex; height: 30px; border-radius: 10px; overflow: hidden">
    <span style="flex: 1.5; background: #252C4A"></span><span style="flex: 5.7; background: #FBF7EF"></span><span style="flex: 3; background: #EFE4D1"></span><span style="flex: 1.5; background: #3F2536; box-shadow: inset 0 0 0 2px #E8A27C"></span><span style="flex: 3.6; background: #121933"></span>
  </div>
  <div style="margin: 6px 22px 0; display: flex; justify-content: space-between; font-size: 11px; color: #CDAAB9"><span>05:52</span><span>13:07</span><span>16:08</span><span>18:50</span><span>20:23</span></div>

  <div style="margin: 20px 22px 0; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #CDAAB9">Islamisches Muster</div>
  <div style="margin: 8px 22px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <button style="height: 74px; border-radius: 16px; border: 1px solid #5E3B53; background: transparent; color: #F6EAEE; font: inherit; font-size: 13px; cursor: pointer">Fein</button>
    <button style="height: 74px; border-radius: 16px; border: 2px solid #E8A27C; background: #4E2E43; color: #F6EAEE; font: inherit; font-size: 13px; cursor: pointer">Edel</button>
    <button style="height: 74px; border-radius: 16px; border: 1px solid #5E3B53; background: transparent; color: #F6EAEE; font: inherit; font-size: 13px; cursor: pointer">Kräftig</button>
  </div>

  <div style="margin: 20px 22px 0; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #CDAAB9">Hintergrund</div>
  <div style="margin: 8px 22px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="height: 80px; border-radius: 16px; border: 2px solid #E8A27C; background: #4E2E43; color: #F6EAEE; font: inherit; font-size: 13px; cursor: pointer">Farbe + Muster</button>
    <button style="height: 80px; border-radius: 16px; border: 1.5px dashed #8A5C78; background: transparent; color: #F6EAEE; font: inherit; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8A27C" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Eigenes Foto</button>
  </div>

  <div style="margin: 14px 22px 0; display: flex; flex-direction: column">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
      <div style="{{o.rowStyle}}">
        <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px">{{o.label}}</span><span style="font-size: 12px; color: #CDAAB9">{{o.hint}}</span></div>
        <span style="{{o.toggleStyle}}"><span style="{{o.knobStyle}}"></span></span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Kalligrafie', 'arabische Gebetsnamen in Ruqaa', true],
      ['Sanfte Übergänge', 'Farbwechsel über eine Minute', true],
    ];
    const opts = data.map(([label, hint, on], i) => ({
      label, hint,
      rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 12px 0;' + (i ? ' border-top: 1px solid #5E3B53;' : ''),
      toggleStyle: 'width: 50px; height: 30px; border-radius: 999px; position: relative; flex: none; background: ' + (on ? '#E8A27C' : '#5E3B53'),
      knobStyle: 'position: absolute; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #3F2536; ' + (on ? 'left: 23px' : 'left: 3px'),
    }));
    return { opts };
  }
}
</script>
</body>
</html>
