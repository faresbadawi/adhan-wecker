<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>App – Gestaltung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{color:#F08A4B; text-decoration: none}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #3A1A2E; color: #F7E9EE; font-family: 'Readex Pro', system-ui, sans-serif">
  <div style="padding: 22px 22px 0; display: flex; align-items: center; gap: 12px">
    <a href="Uhr.dc.html" aria-label="Zurück" style="width: 40px; height: 40px; border-radius: 50%; background: #4A2540; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7E9EE" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"></path></svg></a>
    <span style="font-size: 28px; font-weight: 600">Gestaltung</span>
  </div>

  <div style="margin: 18px 22px 0; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #C9A4B6">Farben</div>
  <div style="margin: 8px 22px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <button style="border-radius: 16px; border: 2px solid #F08A4B; background: #4A2540; padding: 8px; display: flex; flex-direction: column; gap: 8px; color: #F7E9EE; font: inherit; font-size: 13px; cursor: pointer">
      <span style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 54px; border-radius: 10px; overflow: hidden"><span style="background: #1B2347"></span><span style="background: #FBF8F2"></span><span style="background: #EBDDC6"></span><span style="background: #3A1A2E"></span><span style="background: #0D1328"></span></span>Nach Tageszeit
    </button>
    <button style="border-radius: 16px; border: 1px solid #5A3550; background: transparent; padding: 8px; display: flex; flex-direction: column; gap: 8px; color: #F7E9EE; font: inherit; font-size: 13px; cursor: pointer">
      <span style="height: 54px; border-radius: 10px; background: #0D1328"></span>Immer Nacht
    </button>
    <button style="border-radius: 16px; border: 1px solid #5A3550; background: transparent; padding: 8px; display: flex; flex-direction: column; gap: 8px; color: #F7E9EE; font: inherit; font-size: 13px; cursor: pointer">
      <span style="height: 54px; border-radius: 10px; background: #FBF8F2"></span>Immer Tag
    </button>
  </div>

  <div style="margin: 20px 22px 0; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #C9A4B6">Dein Tag in Farben</div>
  <div style="margin: 8px 22px 0; display: flex; height: 30px; border-radius: 10px; overflow: hidden">
    <span style="flex: 1.5; background: #1B2347"></span><span style="flex: 5.7; background: #FBF8F2"></span><span style="flex: 3; background: #EBDDC6"></span><span style="flex: 1.5; background: #3A1A2E; box-shadow: inset 0 0 0 2px #F08A4B"></span><span style="flex: 3.6; background: #0D1328"></span>
  </div>
  <div style="margin: 6px 22px 0; display: flex; justify-content: space-between; font-size: 11px; color: #C9A4B6"><span>05:52</span><span>13:07</span><span>16:08</span><span>18:50</span><span>20:23</span></div>

  <div style="margin: 20px 22px 0; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #C9A4B6">Hintergrund</div>
  <div style="margin: 8px 22px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="height: 92px; border-radius: 16px; border: 2px solid #F08A4B; background: #4A2540; color: #F7E9EE; font: inherit; font-size: 13px; cursor: pointer">Ruhige Fläche</button>
    <button style="height: 92px; border-radius: 16px; border: 1.5px dashed #8A5C78; background: transparent; color: #F7E9EE; font: inherit; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F08A4B" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Eigenes Foto</button>
  </div>

  <div style="margin: 18px 22px 0; display: flex; flex-direction: column">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
      <div style="{{o.rowStyle}}">
        <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px">{{o.label}}</span><span style="font-size: 12px; color: #C9A4B6">{{o.hint}}</span></div>
        <span style="{{o.toggleStyle}}"><span style="{{o.knobStyle}}"></span></span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Sonnenbogen', 'auf der Seite „Heute“', true],
      ['Kalligrafie', 'arabische Gebetsnamen in Ruqaa', true],
      ['Sanfte Übergänge', 'Farbwechsel über eine Minute', true],
    ];
    const opts = data.map(([label, hint, on], i) => ({
      label, hint,
      rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 12px 0;' + (i ? ' border-top: 1px solid #5A3550;' : ''),
      toggleStyle: 'width: 50px; height: 30px; border-radius: 999px; position: relative; flex: none; background: ' + (on ? '#F08A4B' : '#5A3550'),
      knobStyle: 'position: absolute; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #3A1A2E; ' + (on ? 'left: 23px' : 'left: 3px'),
    }));
    return { opts };
  }
}
</script>
</body>
</html>
