<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بلال · ساعة الأذان الذكية</title>
<meta name="description" content="Bilal – بلال: Gebetszeiten & Azan · مواقيت الصلاة والأذان · Prayer times & Azan">
<meta name="theme-color" content="#040607">
<meta property="og:title" content="Bilal · بلال">
<meta property="og:description" content="مواقيت الصلاة والأذان · Gebetszeiten & Azan · Prayer times & Azan">
<meta property="og:image" content="https://faresbadawi.github.io/adhan-wecker/bilal/assets/img/og.jpg">
<meta property="og:url" content="https://faresbadawi.github.io/adhan-wecker/bilal/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png">
<link rel="preload" href="fonts/Amiri-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>

<div class="scrollbar" aria-hidden="true"><i id="scrollbar"></i></div>
<nav class="nav" id="nav">
  <a class="brand" href="#top" aria-label="Bilal"><b>بلال</b><span class="latin">BILAL</span></a>
  <ul class="links">
    <li><a href="#try" data-t="nav.try"></a></li>
    <li><a href="#features" data-t="nav.features"></a></li>
    <li><a href="#design" data-t="nav.design"></a></li>
    <li><a href="#guide" data-t="nav.guide"></a></li>
  </ul>
  <div class="nav-end">
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="ar" lang="ar">ع</button><button data-lang="de">DE</button><button data-lang="en">EN</button>
    </div>
    <a class="icon-btn" href="#guide" aria-label="Guide"><svg viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg></a>
  </div>
</nav>

<!-- 1 · Bühne -->
<header class="hero" id="top">
  <div class="hero-bg"></div>
  <svg class="draw" id="heroDraw" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <div class="hero-vignette"></div>
  <canvas class="dust" id="dust" aria-hidden="true"></canvas>
  <div class="hero-inner" id="heroInner">
    <svg class="crest up" viewBox="0 0 100 100" aria-hidden="true"><rect x="22" y="22" width="56" height="56"/><rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="10"/></svg>
    <h1 class="up d1">بلال</h1>
    <div class="latin wordmark up d2">B I L A L</div>
    <p class="sub up d3" data-t="hero.sub"></p>
    <a class="btn up d4" href="#try" data-t="hero.cta"></a>
  </div>
  <div class="scroll-cue" aria-hidden="true"></div>
</header>

<!-- 2 · Produkt dreht sich beim Scrollen (Folien) -->
<section class="reveal" id="reveal">
  <div class="sticky">
    <div class="reveal-glow"></div>
    <div class="reveal-stage">
      <img data-img="hero-weiss" alt="" class="rv-img on">
      <img data-img="hero-schwarz" alt="" class="rv-img">
      <img src="assets/img/rueckseite.webp" alt="" class="rv-img">
    </div>
    <div class="reveal-caps">
      <h2 class="cap on" data-t="reveal.1"></h2>
      <h2 class="cap" data-t="reveal.2"></h2>
      <h2 class="cap" data-t="reveal.3"></h2>
    </div>
    <div class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
  </div>
</section>

<!-- 3 · Leitsatz -->
<section class="statement">
  <p id="statement" data-t="statement"></p>
  <div class="stats">
    <div class="rv"><b class="num" data-count="5">0</b><span data-t="st1"></span></div>
    <div class="rv d1"><b class="num" data-count="6">0</b><span data-t="st2"></span></div>
    <div class="rv d2"><b class="num" data-count="3">0</b><span data-t="st3"></span></div>
    <div class="rv d3"><b class="num" data-count="2">0</b><span data-t="st4"></span></div>
  </div>
</section>

<!-- 4 · Simulator -->
<section class="sim" id="try">
  <div class="head center">
    <p class="eyebrow" data-t="sim.eyebrow"></p>
    <h2 data-t="sim.title"></h2>
    <p class="lead" data-t="sim.lead"></p>
  </div>
  <div class="sim-stage" id="simStage">
    <div class="sim-loading" id="simLoading" data-t="sim.loading"></div>
    <div class="sim-hint" id="simHint" data-t="sim.hint"></div>
    <div class="sim-ui">
      <button class="power" id="power" aria-pressed="false"><span class="knob"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 7.2a8 8 0 1 0 11.4 0"/></svg></span><span id="powerLabel" data-t="sim.on"></span></button>
      <div class="finish" role="group">
        <button data-f="assets/bilal-weiss.3mf" class="sel"><i></i><span data-t="sim.white"></span></button>
        <button data-f="assets/bilal-schwarz.3mf"><i></i><span data-t="sim.black"></span></button>
      </div>
    </div>
  </div>
</section>

<!-- 5 · Funktionen als Folien quer durchs Bild -->
<section class="gallery" id="features">
  <div class="sticky">
    <div class="head">
      <p class="eyebrow" data-t="feat.eyebrow"></p>
      <h2 data-t="feat.title"></h2>
    </div>
    <div class="track" id="track">
      <article class="slide"><img data-img="hero-schwarz" alt=""><div><h3 data-t="f1.t"></h3><p data-t="f1.p"></p></div></article>
      <article class="slide"><img data-img="front-uhr" alt=""><div><h3 data-t="f2.t"></h3><p data-t="f2.p"></p></div></article>
      <article class="slide"><img data-img="schwarz-nacht" alt=""><div><h3 data-t="f3.t"></h3><p data-t="f3.p"></p></div></article>
      <article class="slide"><img data-img="weiss-kalender" alt=""><div><h3 data-t="f4.t"></h3><p data-t="f4.p"></p></div></article>
      <article class="slide"><img data-img="schwarz-mond" alt=""><div><h3 data-t="f5.t"></h3><p data-t="f5.p"></p></div></article>
      <article class="slide"><img data-img="weiss-wetter" alt=""><div><h3 data-t="f6.t"></h3><p data-t="f6.p"></p></div></article>
    </div>
    <div class="progress"><i id="trackBar"></i></div>
  </div>
</section>

<!-- 6 · Das Ornament zeichnet sich beim Scrollen -->
<section class="motif" id="motif">
  <div class="sticky">
    <svg class="draw" id="motifDraw" viewBox="0 0 1000 1000" aria-hidden="true"></svg>
    <div class="motif-text">
      <p class="eyebrow" data-t="motif.eyebrow"></p>
      <h2 data-t="motif.title"></h2>
      <p class="lead" data-t="motif.lead"></p>
    </div>
  </div>
</section>

<!-- 7 · Zwei Farben -->
<section id="design">
  <div class="head center">
    <p class="eyebrow rv" data-t="duo.eyebrow"></p>
    <h2 class="rv d1" data-t="duo.title"></h2>
    <p class="lead rv d2" data-t="duo.lead"></p>
  </div>
  <div class="duo">
    <figure class="light rv"><img loading="lazy" data-img="duo-weiss" alt=""><figcaption><span data-t="duo.w"></span><small data-t="duo.ws"></small></figcaption></figure>
    <figure class="dark rv d1"><img loading="lazy" data-img="duo-schwarz" alt=""><figcaption><span data-t="duo.b"></span><small data-t="duo.bs"></small></figcaption></figure>
  </div>
</section>

<!-- 7b · Im Alltag -->
<section class="life" id="life">
  <div class="head center">
    <p class="eyebrow rv" data-t="life.eyebrow"></p>
    <h2 class="rv d1" data-t="life.title"></h2>
  </div>
  <div class="life-grid">
    <figure class="big rv"><div class="frame"><div class="px"><img loading="lazy" src="assets/img/life-1.webp" alt=""></div></div><figcaption data-t="life.1"></figcaption></figure>
    <figure class="rv d1"><div class="frame"><div class="px"><img loading="lazy" src="assets/img/life-2.webp" alt=""></div></div><figcaption data-t="life.2"></figcaption></figure>
    <figure class="rv"><div class="frame"><div class="px"><img loading="lazy" src="assets/img/life-3.webp" alt=""></div></div><figcaption data-t="life.3"></figcaption></figure>
    <figure class="big rv d1"><div class="frame"><div class="px"><img loading="lazy" src="assets/img/life-4.webp" alt=""></div></div><figcaption data-t="life.4"></figcaption></figure>
  </div>
</section>

<!-- 8 · Weitere Funktionen -->
<section class="more">
  <h2 class="center rv" data-t="more.title"></h2>
  <div class="grid">
    <article class="mini rv"><svg viewBox="0 0 24 24"><path d="M12 3c-1.5 2-1.5 3.5 0 5M6 21V11a6 6 0 0 1 12 0v10M4 21h16M10 21v-4a2 2 0 0 1 4 0v4"/></svg><h3 data-t="m1.t"></h3><p data-t="m1.p"></p></article>
    <article class="mini rv d1"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 2M5 4 2 7M19 4l3 3"/></svg><h3 data-t="m2.t"></h3><p data-t="m2.p"></p></article>
    <article class="mini rv d2"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><h3 data-t="m3.t"></h3><p data-t="m3.p"></p></article>
    <article class="mini rv"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><h3 data-t="m4.t"></h3><p data-t="m4.p"></p></article>
    <article class="mini rv d1"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg><h3 data-t="m5.t"></h3><p data-t="m5.p"></p></article>
    <article class="mini rv d2"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><h3 data-t="m6.t"></h3><p data-t="m6.p"></p></article>
  </div>
</section>

<!-- 9 · Technik -->
<section id="specs">
  <h2 class="rv" data-t="specs.title"></h2>
  <dl class="specs rv d1">
    <div><dt data-t="s1.k"></dt><dd data-t="s1.v"></dd></div>
    <div><dt data-t="s2.k"></dt><dd data-t="s2.v"></dd></div>
    <div><dt data-t="s3.k"></dt><dd data-t="s3.v"></dd></div>
    <div><dt data-t="s4.k"></dt><dd data-t="s4.v"></dd></div>
    <div><dt data-t="s5.k"></dt><dd data-t="s5.v"></dd></div>
    <div><dt data-t="s6.k"></dt><dd data-t="s6.v"></dd></div>
    <div><dt data-t="s7.k"></dt><dd data-t="s7.v"></dd></div>
    <div><dt data-t="s8.k"></dt><dd data-t="s8.v"></dd></div>
    <div><dt data-t="s9.k"></dt><dd data-t="s9.v"></dd></div>
  </dl>
</section>

<!-- 10 · Anleitung -->
<section class="guide" id="guide">
  <div class="guide-box rv">
    <div class="book" aria-hidden="true"><b>بلال</b><span class="latin">GUIDE</span></div>
    <div>
      <h2 data-t="guide.title"></h2>
      <p class="lead" data-t="guide.lead"></p>
    </div>
    <div class="guide-actions">
      <a class="btn" id="guideLink" download><svg viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg><span data-t="guide.dl"></span> <span class="num">PDF</span></a>
      <a class="btn" id="guideLink2" download><svg viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg><span data-t="guide.dl2"></span> <span class="num">PDF</span></a>
      <a class="btn ghost" href="https://faresbadawi.github.io/adhan-wecker/" target="_blank" rel="noopener" data-t="guide.app"></a>
    </div>
  </div>
</section>

<footer>
  <svg class="crest" viewBox="0 0 100 100" aria-hidden="true"><rect x="22" y="22" width="56" height="56"/><rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="10"/></svg>
