<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bilal Zentrale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0A08; --surface: #16140F; --surface2: #1E1B15; --line: #2C271E;
    --text: #F4EEE3; --muted: #A79C8A; --dim: #6E6557;
    --gold: #E8A04E; --gold-soft: rgba(232,160,78,.14);
    --ok: #6FC79A; --off: #8A7F70; --warn: #E8A04E; --bad: #E57373;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  .wrap { max-width: 960px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin: 8px 0 22px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--gold-soft); display: grid; place-items: center; color: var(--gold); flex: none; }
  h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  header .sp { flex: 1; }
  button { font: inherit; border: 0; cursor: pointer; border-radius: 999px; padding: 9px 16px; font-weight: 600; }
  .btn { background: var(--gold); color: #1A1206; }
  .btn:disabled { opacity: .45; cursor: default; }
  .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .ghost:hover { color: var(--text); border-color: var(--dim); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .stat b { display: block; font-size: 24px; font-weight: 700; }
  .stat span { color: var(--muted); font-size: 12.5px; }
  .bar { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; flex-wrap: wrap; }
  .bar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0; flex: 1; }
  .list { display: grid; gap: 10px; }
  .clock { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); grid-row: span 2; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(111,199,154,.15); }
  .clock .name { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  .clock .meta { color: var(--muted); font-size: 13px; display: flex; gap: 6px 14px; flex-wrap: wrap; grid-column: 2; }
  .clock .acts { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: 8px; align-items: center; }
  .tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
  .tag.old { background: var(--gold-soft); color: var(--gold); }
  .tag.wait { background: rgba(111,199,154,.12); color: var(--ok); }
  .icon-btn { background: transparent; color: var(--dim); padding: 8px; border-radius: 10px; }
  .icon-btn:hover { color: var(--bad); background: var(--surface2); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 18px; }
  .login { max-width: 360px; margin: 14vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 26px; }
  .login h1 { margin: 14px 0 6px; }
  .login p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  input:focus { outline: none; border-color: var(--gold); }
  .login button { width: 100%; padding: 12px; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; margin: 0 0 8px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--line); padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .hint { color: var(--dim); font-size: 12.5px; margin-top: 18px; }
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .clock { grid-template-columns: auto 1fr; }
    .clock .acts { grid-row: auto; grid-column: 1 / -1; justify-content: flex-end; margin-top: 6px; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const LOGO = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M5 21V10a7 7 0 0 1 14 0v11"/><path d="M3 21h18M9 21v-5a3 3 0 0 1 6 0v5"/></svg>';
const TRASH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
const ONLINE_SEC = 25 * 60; // meldet sich alle 10 Minuten
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let pass = '';
try { pass = localStorage.getItem('pw') || ''; } catch (e) { /* privat */ }
let data = null, timer = 0;

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2600); }
function ago(sec) {
  if (sec < 90) return 'gerade eben';
  if (sec < 3600) return `vor ${Math.round(sec / 60)} Min.`;
  if (sec < 86400) return `vor ${Math.round(sec / 3600)} Std.`;
  return `vor ${Math.round(sec / 86400)} Tagen`;
}
async function call(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { authorization: 'Bearer ' + pass, ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { logout(); throw new Error('login'); }
  if (!r.ok) throw new Error('http');
  return r.json();
}
function logout() { pass = ''; try { localStorage.removeItem('pw'); } catch (e) {} clearInterval(timer); renderLogin(); }

function renderLogin(err) {
  $('#app').innerHTML = `<form class="login" id="f">
    <div class="logo">${LOGO}</div><h1>Bilal Zentrale</h1><p>Übersicht und Updates aller Uhren.</p>
    <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" autofocus>
    <p class="err">${err ? esc(err) : ''}</p><button class="btn">Anmelden</button></form>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    pass = $('#pw').value;
    try { await load(); try { localStorage.setItem('pw', pass); } catch (x) {} timer = setInterval(load, 30000); }
    catch (x) { renderLogin('Passwort stimmt nicht'); }
  };
}

async function load() {
  const [c, i] = await Promise.all([call('/admin/api/clocks'), call('/admin/api/interest').catch(() => ({ interest: [] }))]);
  data = { ...c, interest: i.interest || [] };
  render();
}

function render() {
  const { clocks, latest, now } = data;
  const online = clocks.filter(c => now - c.last_seen < ONLINE_SEC).length;
  const old = clocks.filter(c => latest.build && c.build < latest.build).length;
  const cities = new Set(clocks.map(c => c.city).filter(Boolean)).size;
  $('#app').innerHTML = `
    <header><div class="logo">${LOGO}</div><div><h1>Bilal Zentrale</h1><p>Neueste Version: ${latest.version ? esc(latest.version) : '—'}</p></div>
      <span class="sp"></span><button class="ghost" id="out">Abmelden</button></header>
    <div class="stats">
      <div class="stat"><b>${clocks.length}</b><span>Uhren</span></div>
      <div class="stat"><b style="color:var(--ok)">${online}</b><span>verbunden</span></div>
      <div class="stat"><b style="color:${old ? 'var(--gold)' : 'inherit'}">${old}</b><span>brauchen ein Update</span></div>
      <div class="stat"><b>${cities}</b><span>Orte</span></div>
    </div>
    <div class="bar"><h2>Uhren</h2><button class="btn" id="all" ${old ? '' : 'disabled'}>Alle aktualisieren</button></div>
    <div class="list">${clocks.length ? clocks.map(c => {
      const on = now - c.last_seen < ONLINE_SEC;
      const isOld = latest.build && c.build < latest.build;
      const place = [c.city, c.country].filter(Boolean).join(', ');
      return `<div class="clock">
        <span class="dot ${on ? 'on' : ''}" title="${on ? 'verbunden' : 'nicht verbunden'}"></span>
        <div class="name">${esc(c.name || c.id)}</div>
        <div class="meta"><span>${place ? esc(place) : 'Ort unbekannt'}</span><span>${on ? 'verbunden' : 'zuletzt ' + ago(now - c.last_seen)}</span>
          <span class="tag ${isOld ? 'old' : ''}">Version ${esc(c.version || '?')}${isOld ? ' · veraltet' : ''}</span>
          ${c.update_wanted ? '<span class="tag wait">Update beim nächsten Melden</span>' : ''}</div>
        <div class="acts">${isOld && !c.update_wanted ? `<button class="ghost" data-up="${esc(c.id)}">Aktualisieren</button>` : ''}
          <button class="icon-btn" data-del="${esc(c.id)}" title="Aus der Liste entfernen" aria-label="Entfernen">${TRASH}</button></div>
      </div>`;
    }).join('') : '<div class="empty">Noch keine Uhr hat sich gemeldet. Uhren melden sich wenige Minuten nach dem Einschalten.</div>'}</div>
    <div class="bar"><h2>Interessenten (${data.interest.length})</h2>${data.interest.length ? '<button class="ghost" id="copy">Adressen kopieren</button>' : ''}</div>
    <div class="list">${data.interest.length ? data.interest.map(p => `<div class="clock">
        <div class="name">${esc(p.email)}</div>
        <div class="meta"><span>${esc((p.lang || '').toUpperCase())}</span><span>${ago(now - p.created)}</span></div>
        <div class="acts"><button class="icon-btn" data-delmail="${esc(p.email)}" title="Löschen" aria-label="Löschen">${TRASH}</button></div>
      </div>`).join('') : '<div class="empty">Noch niemand hat sich auf der Produktseite eingetragen.</div>'}</div>
    <p class="hint">Uhren melden sich alle 10 Minuten. Ein Update startet beim nächsten Melden, ohne Gebet oder Wecker zu stören. Gezeigt wird nur die eingestellte Stadt, keine genaue Position.</p>`;
  $('#out').onclick = logout;
  $('#all').onclick = async () => { await call('/admin/api/update', { all: true }); toast('Alle Uhren aktualisieren sich beim nächsten Melden'); load(); };
  document.querySelectorAll('[data-up]').forEach(b => b.onclick = async () => { await call('/admin/api/update', { ids: [b.dataset.up] }); toast('Update angefordert'); load(); });
  document.querySelectorAll('[data-delmail]').forEach(b => b.onclick = async () => {
    if (!confirm('Diese E-Mail-Adresse endgültig löschen?')) return;
    await call('/admin/api/interest/delete', { email: b.dataset.delmail }); load();
  });
  const cp = $('#copy');
  if (cp) cp.onclick = async () => { await navigator.clipboard.writeText(data.interest.map(p => p.email).join(', ')); toast('Adressen kopiert'); };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Diese Uhr aus der Liste entfernen? Meldet sie sich wieder, erscheint sie erneut.')) return;
    await call('/admin/api/forget', { id: b.dataset.del }); load();
  });
}

if (pass) load().then(() => { timer = setInterval(load, 30000); }).catch(() => renderLogin()); else renderLogin();
</script>
</body>
</html>
