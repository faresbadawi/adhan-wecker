<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>App – Wecker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{color:#D8C08C}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #121933; color: #E9EBF3; font-family: 'Readex Pro', system-ui, sans-serif">
  <svg width="390" height="160" style="position: absolute; left: 0; top: 0">
    <defs>
      <pattern id="gz" width="56" height="56" patternUnits="userSpaceOnUse"><g fill="none" stroke="#D8C08C" stroke-width="0.9"><rect x="16" y="16" width="24" height="24"></rect><rect x="16" y="16" width="24" height="24" transform="rotate(45 28 28)"></rect><circle cx="28" cy="28" r="5"></circle><path d="M0 28h10M46 28h10M28 0v10M28 46v10M0 0l10 10M56 0 46 10M0 56l10-10M56 56 46 46"></path></g></pattern>
      <linearGradient id="lz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"></stop><stop offset="1" stop-color="#000"></stop></linearGradient>
      <mask id="mz"><rect width="390" height="160" fill="url(#lz)"></rect></mask>
    </defs>
    <rect width="390" height="160" fill="url(#gz)" opacity="0.3" mask="url(#mz)"></rect>
  </svg>
  <div style="position: relative; padding: 22px 22px 0; display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 13px; color: #939BB8">Nächster: morgen 05:30</span>
      <span style="font-size: 32px; font-weight: 600; letter-spacing: -0.5px">Wecker</span>
    </div>
    <button aria-label="Neuer Wecker" style="width: 48px; height: 48px; border-radius: 50%; border: 0; background: #D8C08C; color: #121933; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>

  <div style="position: relative; margin: 16px 22px 0; display: flex; flex-direction: column">
    <sc-for list="{{alarms}}" as="a" hint-placeholder-count="3">
      <div style="{{a.rowStyle}}">
        <div style="display: flex; flex-direction: column; flex: 1; gap: 2px">
          <span style="{{a.timeStyle}}">{{a.time}}</span>
          <span style="font-size: 14px; color: #939BB8">{{a.name}} · {{a.days}}</span>
        </div>
        <span style="{{a.toggleStyle}}"><span style="{{a.knobStyle}}"></span></span>
      </div>
    </sc-for>
  </div>

  <div style="margin: 24px 22px 0; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #939BB8">Für alle Wecker</div>
  <div style="margin: 6px 22px 0; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid #222B4D">
      <span style="flex: 1; font-size: 15px">Weckton</span><span style="font-size: 14px; color: #939BB8">Ruhig · Glocken</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C6688" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid #222B4D">
      <span style="flex: 1; font-size: 15px">Sanft lauter werden</span><span style="font-size: 14px; color: #939BB8">45 Sek.</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid #222B4D">
      <span style="flex: 1; font-size: 15px">Schlummern</span><span style="font-size: 14px; color: #939BB8">10 Min.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-top: 1px solid #222B4D; border-bottom: 1px solid #222B4D">
      <span style="font-size: 15px">Lautstärke</span>
      <div style="display: flex; align-items: center; gap: 12px"><div style="flex: 1; height: 6px; border-radius: 6px; background: #222B4D; position: relative"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 70%; border-radius: 6px; background: #D8C08C"></div><div style="position: absolute; left: 70%; top: -8px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: #E9EBF3"></div></div><span style="width: 40px; text-align: right; font-size: 14px">70 %</span></div>
    </div>
  </div>

  <nav style="position: absolute; left: 12px; right: 12px; bottom: 16px; height: 68px; border-radius: 24px; background: #1C2446; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; text-align: center; font-size: 11px">
    <a href="Heute.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #939BB8; text-decoration: none"><svg width="22" height="22" viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="-6.5" y="-6.5" width="13" height="13"></rect><rect x="-6.5" y="-6.5" width="13" height="13" transform="rotate(45)"></rect></svg>Heute</a>
    <a href="Gebete.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #939BB8; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 21V11a8 8 0 0 1 16 0v10M9 21v-5a3 3 0 0 1 6 0v5M3 21h18"></path></svg>Gebete</a>
    <a href="Wecker.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #E9EBF3; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D8C08C" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="7.5"></circle><path d="M12 9.5V13l2.2 1.6"></path></svg>Wecker</a>
    <a href="Uhr.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #939BB8; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="13" rx="3"></rect><path d="M8 21h8"></path></svg>Uhr</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [['05:30', 'Arbeit', 'Mo–Fr', true], ['08:00', 'Wochenende', 'Sa, So', true], ['14:30', 'Mittagsschlaf', 'Fr', false]];
    const alarms = data.map(([time, name, days, on], i) => ({
      time, name, days,
      rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 14px 0;' + (i ? ' border-top: 1px solid #222B4D;' : ''),
      timeStyle: 'font-size: 44px; font-weight: 200; line-height: 1.05; color: ' + (on ? '#E9EBF3' : '#4D5677'),
      toggleStyle: 'width: 50px; height: 30px; border-radius: 999px; position: relative; flex: none; background: ' + (on ? '#D8C08C' : '#262F55'),
      knobStyle: 'position: absolute; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: ' + (on ? '#121933' : '#939BB8') + '; ' + (on ? 'left: 23px' : 'left: 3px'),
    }));
    return { alarms };
  }
}
</script>
</body>
</html>
