; Adhan-Wecker – Board: LCDwiki 3.5" ESP32-S3 Display (ES3C35P), ESP32-S3 N16R8
; Doku: https://www.lcdwiki.com/3.5inch_ESP32-S3_Display

[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; 16 MB Flash, 8 MB OPI-PSRAM
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

lib_deps =
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Isrc
    -DWM_STRINGS_FILE="\"wm_strings_ar.h\""

monitor_speed = 115200
upload_speed = 921600
