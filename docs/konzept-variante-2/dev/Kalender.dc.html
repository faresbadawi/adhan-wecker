<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Uhr – Kalender</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;600&amp;family=Aref+Ruqaa:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 480px; height: 320px; position: relative; overflow: hidden; background: #121933; color: #E9EBF3; font-family: 'Readex Pro', system-ui, sans-serif">
  <svg width="480" height="320" viewBox="0 0 480 320" style="position: absolute; left: 0; top: 0">
    <defs>
      <pattern id="gz" width="64" height="64" patternUnits="userSpaceOnUse"><g fill="none" stroke="#D8C08C" stroke-width="0.9"><rect x="18" y="18" width="28" height="28"></rect><rect x="18" y="18" width="28" height="28" transform="rotate(45 32 32)"></rect><circle cx="32" cy="32" r="6"></circle><path d="M0 32h12M52 32h12M32 0v12M32 52v12M0 0l12 12M64 0 52 12M0 64l12-12M64 64 52 52"></path></g></pattern>
    </defs>
    <rect x="300" y="0" width="180" height="320" fill="url(#gz)" opacity="0.16"></rect>
  </svg>
  <div style="position: relative; box-sizing: border-box; height: 320px; padding: 16px 20px; display: flex; gap: 18px">
    <div style="width: 266px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 20px">Oktober 2026</span><span style="font-size: 12px; color: #939BB8">Rabīʿ I – II</span></div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 11px; color: #939BB8; padding: 4px 0">
        <span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span style="color: #D8C08C">Fr</span><span>Sa</span><span>So</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px; text-align: center">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
          <div style="{{d.style}}"><span style="font-size: 15px">{{d.g}}</span><span style="font-size: 9px; opacity: 0.6">{{d.h}}</span></div>
        </sc-for>
      </div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid #27305A; padding-left: 18px">
      <div style="font-family: 'Aref Ruqaa', serif; font-size: 30px; color: #D8C08C; line-height: 1.1" lang="ar" dir="rtl">ربيع الآخر</div>
      <div style="font-size: 13px; color: #939BB8">1448 nach der Hidschra</div>
      <div style="font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #939BB8; margin-top: 8px">Besondere Tage</div>
      <div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px">
        <div style="display: flex; justify-content: space-between"><span>Isra &amp; Mi'radsch</span><span style="color: #939BB8">≈ 16. Jan.</span></div>
        <div style="display: flex; justify-content: space-between"><span>Ramadan-Beginn</span><span style="color: #939BB8">≈ 8. Feb.</span></div>
        <div style="display: flex; justify-content: space-between"><span>Eid al-Fitr</span><span style="color: #939BB8">≈ 10. März</span></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const cells = [];
    for (let i = 0; i < 3; i++) cells.push({ g: '', h: '', style: 'height: 34px' });
    for (let d = 1; d <= 31; d++) {
      const hijri = ((d + 18) % 30) + 1;
      const today = d === 8;
      const friday = d % 7 === 2;
      let style = 'height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; line-height: 1.1';
      if (today) style += '; background: #D8C08C; color: #121933';
      else if (friday) style += '; color: #D8C08C';
      cells.push({ g: String(d), h: String(hijri), style });
    }
    while (cells.length < 35) cells.push({ g: '', h: '', style: 'height: 34px' });
    return { days: cells };
  }
}
</script>
</body>
</html>
